[package]
name = "rust_lib_rf_viewer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
imagesize = "0.15.0"
walkdir = "2.5.0"
wallpaper = "3.2.0"
uuid = { version = "1.19.0", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
