[package]
name = "rust_lib_pocket_gallery"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
imagesize = "0.15.0"
jwalk = "0.9.0"
pinyin = "0.11.0"
uuid = { version = "1.19.0", features = ["v4"] }
wallpaper = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
